# ─── Production Profile ──────────────────────────────────────────
# Activate via: spring.profiles.active=prod
# All sensitive values from environment variables

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory_db?useSSL=true&serverTimezone=Asia/Manila}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080}

logging:
  level:
    root: WARN
    com.joven.inventory: INFO
    org.hibernate.SQL: WARN
  file:
    name: logs/inventory-system.log
