# Validation messages for Jakarta Bean Validation
# Referenced in constraint annotations: message = "{key}"

# Common
required.field=This field is required
invalid.email=Please enter a valid email address
invalid.size=Must be between {min} and {max} characters
invalid.min=Must be at least {value}
invalid.max=Must not exceed {value}

# Category
category.name.required=Category name is required
category.name.size=Category name must not exceed 100 characters
category.name.duplicate=A category with this name already exists

# Item
item.name.required=Item name is required
item.name.size=Item name must not exceed 200 characters
item.category.required=Category is required
item.unit.required=Unit of measure is required
item.price.required=Selling price is required
item.price.min=Selling price must be 0 or greater
item.costPrice.required=Cost price is required
item.costPrice.min=Cost price must be 0 or greater
item.reorderLevel.min=Reorder level must be 0 or greater

# Customer
customer.name.required=Customer name is required
customer.name.size=Customer name must not exceed 200 characters

# Supplier
supplier.name.required=Supplier name is required
supplier.name.size=Supplier name must not exceed 200 characters

# User
user.username.required=Username is required
user.username.size=Username must not exceed 50 characters
user.username.duplicate=A user with this username already exists
user.password.required=Password is required
user.password.size=Password must be between 6 and 100 characters
user.fullName.required=Full name is required
user.role.required=Role is required

# Add-on
addon.name.required=Add-on name is required
addon.name.duplicate=An add-on with this name already exists
addon.amount.required=Default amount is required
addon.amount.min=Default amount must be 0 or greater

# Stock
stock.item.required=Item is required
stock.quantity.required=Quantity is required
stock.quantity.min=Quantity must be greater than 0
stock.insufficient=Insufficient stock. Available: {available}, Requested: {requested}

# POS
pos.shift.required=An open shift is required to process sales
pos.shift.already_open=You already have an open shift
pos.payment.insufficient=Payment amount is less than total
pos.void.reason.required=Void reason is required
