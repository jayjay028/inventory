server:
  port: 8080
  servlet:
    context-path: /inventory

spring:
  profiles:
    active: dev

  application:
    name: inventory-system

  # ─── JDBC / DataSource ───────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3308/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: InventoryHikariPool

  # ─── JPA / Hibernate ────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Manila
        default_batch_fetch_size: 20

  # ─── Jackson (JSON) ─────────────────────────────────────────────
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Manila
    deserialization:
      fail-on-unknown-properties: false

  # ─── File Upload ────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ─── Messages ───────────────────────────────────────────────────
  messages:
    basename: config/validation-messages,config/error-messages
    encoding: UTF-8
    cache-duration: 3600

# ─── Application Custom Properties ──────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:inventory-dev-secret-key-change-in-production-minimum-256-bits}
    access-token-expiry: 1800000
    refresh-token-expiry: 604800000
    issuer: inventory-system

  cors:
    allowed-origins: http://localhost:5173,http://localhost:8080
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  reports:
    template-path: classpath:reports/
    output-path: ${java.io.tmpdir}/inventory-reports/

  pos:
    receipt-template: classpath:templates/receipt/pos-receipt.html
    receipt-width: 80mm
    printing-enabled: false
    auto-print: false
    kiosk-mode: false
    barcode-scanner: true

  pagination:
    default-page-size: 20
    max-page-size: 100

  audit:
    enabled: true
    log-ip-address: true

# ─── Logging ─────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.joven.inventory: DEBUG
    org.hibernate.SQL: WARN
  file:
    name: logs/inventory-system.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# ─── Springdoc / Swagger ─────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
