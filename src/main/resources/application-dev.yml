# ─── Development Profile ─────────────────────────────────────────
# Activated by default (spring.profiles.active=dev in application.yml)
# Local MySQL, verbose logging, show SQL

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
    username: root
    password: "root"

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.joven.inventory: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
